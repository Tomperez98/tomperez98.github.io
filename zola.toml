base_url = "https://tomperez98.github.io"
title = "Tomas Perez Alvarez"
description = "Personal blog"
default_language = "en"
theme = "devlab-theme"

compile_sass = true
build_search_index = false
generate_feeds = false
taxonomies = [{ name = "tags" }]

[markdown]
render_emoji = false
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra.devlab.brand]
logo_text = "Tomas Perez"
footer_text = "Tomas Perez Alvarez"
show_logo_mark = false

[extra.devlab.footer]
note = ""

[extra.devlab.navigation]
links = [
  { name = "Home", path = "/" },
  { name = "Posts", path = "/posts/", kind = "blog" },
  { name = "About", path = "/about/" },
]

[extra.devlab.blog]
path = "/posts/"

[extra.devlab.appearance]
default_mode = "light"
show_toggle = false
